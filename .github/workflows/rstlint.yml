name: Lint reStructuredText files

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      lint: ${{ steps.filter.outputs.lint }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check for file changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            lint:
              - .github/workflows/rstlint.yml
              - conf.py
              - requirements.txt
              - requirements-lint.txt
              - "**.rst"

  lint:
    name: Run Sphinx dummy build
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: ${{ matrix.python-version }}
          version: 0.9.2
          activate-environment: true
          cache-dependency-glob: |
            requirements.txt
            requirements-lint.txt

      - name: Install dependencies
        run: uv sync --active --no-install-project --group lint

      - name: Run linter
        run: |
          uv run rst-lint README.rst

      - name: Run Sphinx dummy build to check for errors
        run: |
          uv run sphinx-build --fail-on-warning --keep-going \
            --doctree-dir build/doctrees --builder dummy . _build/dummy
